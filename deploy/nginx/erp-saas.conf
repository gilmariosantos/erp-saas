# ─────────────────────────────────────────────────────────────────────────────
# Configuração Nginx para o ERP SaaS — multi-tenant com wildcard.
#
# Copie para /etc/nginx/sites-available/erp-saas e ajuste:
#   - server_name (seu domínio)
#   - caminhos dos certificados SSL
#   - versão do PHP-FPM se diferente de 8.3
#
# Depois:
#   ln -s /etc/nginx/sites-available/erp-saas /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br *.seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    # Wildcard: aceita o domínio principal E qualquer subdomínio de tenant
    server_name seudominio.com.br *.seudominio.com.br;

    root /var/www/erp-saas/public;
    index index.php;
    charset utf-8;

    # Upload de até 100MB (certificados, XMLs, anexos)
    client_max_body_size 100M;

    # ─── SSL (wildcard) ──────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─── Headers de segurança ────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Compressão ──────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # ─── Roteamento Laravel ──────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 300;
        include fastcgi_params;
    }

    # ─── Bloqueios de segurança ──────────────────────────────────────────────
    location ~ /\.(?!well-known).* { deny all; }
    location ~ /\.env { deny all; }
    location ~ /(storage|bootstrap)/.*\.php$ { deny all; }

    # ─── Cache de assets estáticos ───────────────────────────────────────────
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Logs
    access_log /var/log/nginx/erp-saas.access.log;
    error_log  /var/log/nginx/erp-saas.error.log;
}
