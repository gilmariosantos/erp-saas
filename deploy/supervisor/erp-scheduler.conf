; ─────────────────────────────────────────────────────────────────────────────
; Supervisor — Laravel Scheduler (tarefas agendadas)
; Roda o scheduler a cada 60s sem precisar de cron.
; Copie para /etc/supervisor/conf.d/erp-scheduler.conf
; ─────────────────────────────────────────────────────────────────────────────
[program:erp-scheduler]
process_name=%(program_name)s
command=bash -c "while true; do php /var/www/erp-saas/artisan schedule:run --verbose --no-interaction; sleep 60; done"
autostart=true
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/www/erp-saas/storage/logs/scheduler.log
