; ─────────────────────────────────────────────────────────────────────────────
; Supervisor — Laravel Horizon (processamento de filas)
; Copie para /etc/supervisor/conf.d/erp-horizon.conf
; Depois: supervisorctl reread && supervisorctl update && supervisorctl start erp-horizon
; ─────────────────────────────────────────────────────────────────────────────
[program:erp-horizon]
process_name=%(program_name)s
command=php /var/www/erp-saas/artisan horizon
autostart=true
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/www/erp-saas/storage/logs/horizon.log
stopwaitsecs=3600
